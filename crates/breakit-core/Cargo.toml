[package]
name = "breakit-core"
version = "0.1.0"
description = "Structural solver for BreakIt: 3D beam frames, static FEM and real-time XPBD with plasticity and fracture. No engine dependency."
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
faer = "0.22"
nalgebra.workspace = true
serde = { version = "1", features = ["derive"], optional = true }

[features]
# Serialize/Deserialize on scenario-facing data (load cases, materials are not
# covered yet), for scenario files.
serde = ["dep:serde", "nalgebra/serde-serialize"]
