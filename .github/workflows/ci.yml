name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: breakit-core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo test --release -p breakit-core
      - run: cargo test --release -p breakit-mesh

  # Bevy app: needs system libs for windowing/input (audio is off, so no ALSA).
  game:
    name: breakit-game check and tests
    runs-on: ubuntu-latest
    env:
      # Debug info for all of Bevy fills the runner's disk; the lab example's
      # link then dies with a bus error in rust-lld (red on main since #14).
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux deps for Bevy
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libudev-dev libwayland-dev libxkbcommon-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p breakit-game --all-targets
      - run: cargo check -p breakit-render --all-targets
      - run: cargo test -p breakit-game
      - run: cargo test -p breakit-lab
