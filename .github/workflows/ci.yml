name: CI

# The toolchain comes from rust-toolchain.toml; every job uses the same one.
# Jobs cover the whole workspace, so a new crate is checked and tested
# without editing this file.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Keep target/ small: Bevy debug info and incremental caches fill the
  # runner's disk.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - run: cargo fmt --all --check

  # The engine-free crates, with the release-mode tests the solver relies on
  # (the static FEM is the oracle for the dynamic solver). breakit-audio runs
  # without its `device` feature here, so this job needs no ALSA.
  core:
    name: engine-free crates (clippy, release tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: core
      - run: >-
          cargo clippy --locked --all-targets --no-default-features
          -p breakit-core -p breakit-mesh -p breakit-parts -p breakit-scenario -p breakit-audio
          -p breakit-playground -p breakit-water
          -- -D warnings
      - run: >-
          cargo test --locked --release --no-default-features
          -p breakit-core -p breakit-mesh -p breakit-parts -p breakit-scenario -p breakit-audio
          -p breakit-playground -p breakit-water
      # Hot-path gate (CONTRIBUTING.md, "Hot paths"): SIMD is dispatched and
      # faster than the scalar reference, threads keep the answer and do not
      # lose where they are on, solver work stays within budget.
      - run: cargo run --locked --release --no-default-features -p breakit-core --example gate

  # The Bevy crates are checked and tested in two jobs, on two runners: clippy
  # and rustdoc only need metadata builds, tests need full builds, and doing
  # both on one runner builds Bevy twice and runs out of disk.
  # Both need system libs for windowing and input, and ALSA headers for
  # breakit-audio's sound output.
  lint:
    name: workspace clippy and docs
    runs-on: ubuntu-latest
    steps:
      # The hosted runner has ~14 GB free; a Bevy build needs more. Drop
      # preinstalled toolchains this project never uses.
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium
          sudo docker image prune --all --force || true
          df -h /
      - uses: actions/checkout@v4
      - name: Install Linux deps for Bevy
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libudev-dev libwayland-dev libxkbcommon-dev libasound2-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  game:
    name: game-side crates (build, tests)
    runs-on: ubuntu-latest
    steps:
      # The hosted runner has ~14 GB free; a Bevy build needs more. Drop
      # preinstalled toolchains this project never uses.
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium
          sudo docker image prune --all --force || true
          df -h /
      - uses: actions/checkout@v4
      - name: Install Linux deps for Bevy
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libudev-dev libwayland-dev libxkbcommon-dev libasound2-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: game
      # One full build of every target, reused by the tests. The engine-free
      # crates already ran in release above; debug here keeps the Bevy build small.
      - run: cargo build --locked --all-targets -p breakit-game -p breakit-render -p breakit-lab -p breakit-water-render
      - run: cargo test --locked -p breakit-game -p breakit-render -p breakit-lab -p breakit-water-render
      - run: df -h /
