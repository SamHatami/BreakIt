name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Keep target/ small: Bevy debug info and incremental caches fill the
  # runner's disk.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  core:
    name: breakit-core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo test --release -p breakit-core
      - run: cargo test --release -p breakit-mesh

  # Bevy app: needs system libs for windowing/input (audio is off, so no ALSA).
  game:
    name: breakit-game check and tests
    runs-on: ubuntu-latest
    steps:
      # The hosted runner has ~14 GB free; a Bevy build needs more. Drop
      # preinstalled toolchains this project never uses.
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium
          sudo docker image prune --all --force || true
          df -h /
      - uses: actions/checkout@v4
      - name: Install Linux deps for Bevy
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libudev-dev libwayland-dev libxkbcommon-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # One full build of every game-side crate and target, shared by the
      # test runs below (a separate `cargo check` would build Bevy twice).
      - run: cargo build -p breakit-game -p breakit-render -p breakit-lab --all-targets
      - run: cargo test -p breakit-game -p breakit-lab
      - run: df -h /
