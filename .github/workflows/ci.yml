name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: breakit-core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo test --release -p breakit-core
      - run: cargo test --release -p breakit-mesh
      - run: cargo test --release -p breakit-audio --no-default-features

  # Bevy app: needs system libs for windowing/input, and ALSA headers for
  # breakit-audio's sound output.
  game:
    name: breakit-game check and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux deps for Bevy
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libudev-dev libwayland-dev libxkbcommon-dev libasound2-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p breakit-game --all-targets
      - run: cargo check -p breakit-render --all-targets
      - run: cargo test -p breakit-game
      - run: cargo test -p breakit-lab
