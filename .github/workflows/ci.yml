name: CI

# The toolchain comes from rust-toolchain.toml; every job uses the same one.
# Jobs cover the whole workspace, so a new crate is checked and tested
# without editing this file.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - run: cargo fmt --all --check

  # The engine-free crates, with the release-mode tests the solver relies on
  # (the static FEM is the oracle for the dynamic solver).
  core:
    name: engine-free crates (clippy, release tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: core
      - run: cargo clippy --locked -p breakit-core -p breakit-mesh --all-targets -- -D warnings
      - run: cargo test --locked --release -p breakit-core -p breakit-mesh

  # Everything, including the Bevy crates. Needs system libs for windowing and
  # input (audio is off, so no ALSA).
  workspace:
    name: workspace (clippy, tests, docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux deps for Bevy
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libudev-dev libwayland-dev libxkbcommon-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # Core and mesh already ran in release above; debug here keeps the Bevy
      # build within reach.
      - run: cargo test --locked --workspace --exclude breakit-core --exclude breakit-mesh
      - run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
