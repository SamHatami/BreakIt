name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: breakit-core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo test --release -p breakit-core
      - run: cargo test --release -p breakit-mesh
      - run: cargo test --release -p breakit-parts

  # Bevy app: needs system libs for windowing/input (audio is off, so no ALSA).
  game:
    name: breakit-game check and tests
    runs-on: ubuntu-latest
    env:
      # Debug info for Bevy and the lab example filled the runner's disk
      # (linker bus error at 0 MB free). Tests do not need it.
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
      - name: Install Linux deps for Bevy
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libudev-dev libwayland-dev libxkbcommon-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p breakit-game --all-targets
      - run: cargo check -p breakit-render --all-targets
      - run: cargo test -p breakit-game
      - run: cargo test -p breakit-lab
