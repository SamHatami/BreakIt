name: Release

# Playtest builds of breakit-game, published to GitHub Releases.
#
# - Push a tag `v*` (e.g. `git tag v0.1.0 && git push origin v0.1.0`):
#   a proper release with Windows and Linux zips and generated notes.
# - Every push to main: the rolling `nightly` pre-release is rebuilt, so
#   https://github.com/SamHatami/BreakIt/releases/tag/nightly is always
#   the newest main. Only the newest push builds; older runs are cancelled.
# - Run it by hand from the Actions tab (workflow_dispatch) to rebuild
#   nightly without a push.
# - Pull requests that change this file build the zips (kept as workflow
#   artifacts for 7 days) but publish nothing.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            exe: breakit-game.exe
            out: BreakIt.exe
          - name: linux-x64
            os: ubuntu-latest
            exe: breakit-game
            out: BreakIt
    steps:
      - name: Free runner disk space
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@v4

      - name: Name this build
        id: name
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="$GITHUB_REF_NAME"
            tag="$GITHUB_REF_NAME"
          else
            version="nightly-$(date -u +%Y-%m-%d)"
            tag="nightly"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "BREAKIT_VERSION=$version" >> "$GITHUB_ENV"
          echo "BREAKIT_COMMIT=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Install Linux deps for Bevy
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libudev-dev libwayland-dev libxkbcommon-dev libasound2-dev pkg-config

      # rust-toolchain.toml, when present, picks the exact compiler.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: dist
          # Tags reuse the cache main builds; only main writes it.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build
        run: cargo build --profile dist -p breakit-game

      - name: Package
        shell: bash
        run: |
          dir="BreakIt-${{ steps.name.outputs.tag }}-${{ matrix.name }}"
          mkdir -p "dist/$dir"
          cp "target/dist/${{ matrix.exe }}" "dist/$dir/${{ matrix.out }}"
          cp PLAYTEST.md "dist/$dir/PLAYTEST.md"
          printf '%s (%s)\n' "$BREAKIT_VERSION" "$GITHUB_SHA" > "dist/$dir/VERSION.txt"
          cd dist
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            7z a -tzip "$dir.zip" "$dir" > /dev/null
          else
            zip -qr "$dir.zip" "$dir"
          fi
          ls -l "$dir.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*.zip
          retention-days: 7

  publish:
    name: publish release
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          short="${GITHUB_SHA::7}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            notes="Playtest build $GITHUB_REF_NAME ($short). Download the zip for your system, unpack it and run BreakIt. How to play, what to test and how to report: PLAYTEST.md in the zip, or https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/PLAYTEST.md"
            gh release create "$GITHUB_REF_NAME" dist/*.zip \
              --title "BreakIt $GITHUB_REF_NAME" --notes "$notes" --generate-notes
          else
            notes="Rolling build of main at $short, built $(date -u '+%Y-%m-%d %H:%M UTC'). Newer than the latest tagged release, and less tested. See PLAYTEST.md in the zip."
            # Recreate it so the tag moves to this commit and old zips go.
            gh release delete nightly --yes --cleanup-tag || true
            gh release create nightly dist/*.zip --prerelease --target "$GITHUB_SHA" \
              --title "BreakIt nightly ($short)" --notes "$notes"
          fi
