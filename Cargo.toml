[workspace]
resolver = "2"
members = [
    "crates/breakit-audio",
    "crates/breakit-core",
    "crates/breakit-game",
    "crates/breakit-lab",
    "crates/breakit-mesh",
    "crates/breakit-parts",
    "crates/breakit-render",
    "crates/breakit-scenario",
    "crates/breakit-water",
    "crates/breakit-water-render",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/SamHatami/BreakIt"
# Bevy 0.20.1 needs 1.97.1. The toolchain CI and agents use is pinned in
# rust-toolchain.toml.
rust-version = "1.97.1"

# Every crate opts in with `[lints] workspace = true`. CI runs clippy with
# `-D warnings`, so a warning here fails the build. Silence a lint locally with
# `#[expect(clippy::..., reason = "...")]` on the item, not crate-wide.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
# Bevy systems take many `Query`/`Res` parameters and nested query types by
# design, and solver kernels pass many scalars; these two lints are noise here.
too_many_arguments = "allow"
type_complexity = "allow"
# Leftovers that must not reach main.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# Where a module is allowed `unsafe` (see CONTRIBUTING.md), every block says why.
undocumented_unsafe_blocks = "warn"

[workspace.dependencies]
nalgebra = "0.33"

# Bevy is slow in debug builds; optimise dependencies but keep our own code
# quick to compile.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Playtest builds (the release workflow): `cargo build --profile dist`.
# Thin LTO makes the solver and Bevy a little faster for players without
# slowing `cargo test --release`; symbols are stripped to keep the zip small.
[profile.dist]
inherits = "release"
lto = "thin"
strip = true
